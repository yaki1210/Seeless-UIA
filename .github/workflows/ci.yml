name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build SeelessUIA.slnx -c Release

      - name: Test
        run: dotnet test SeelessUIA.slnx -c Release --no-build
