name: Bug Report
description: Something is broken — snapshot, interaction, or daemon
labels: [bug]
body:
  - type: input
    id: app
    attributes:
      label: Application
      description: What app were you testing? (name, version, framework if known)
      placeholder: "Notepad (Windows 11, Win32)"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command & error output
      description: The exact command you ran and the full error/output
      render: text
    validations:
      required: true
  - type: textarea
    id: snapshot
    attributes:
      label: Snapshot output (--no-clean)
      description: Run `seeless-uia snapshot wN --no-clean` and paste the first 30 lines. This shows the raw UIA tree.
      render: text
  - type: dropdown
    id: snapshot_mode
    attributes:
      label: Snapshot mode
      options:
        - "snapshot -i (interactive)"
        - "snapshot (structured)"
        - "snapshot --no-clean (raw)"
        - "Multiple"
